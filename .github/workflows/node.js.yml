# NextJS 리뉴얼(web-next) 빌드 검증.
# 루트는 정적 사이트(index.html/styles.css/script.js)라 빌드 대상이 아니다.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-next # package.json이 여기 있다

    strategy:
      matrix:
        # Next 16은 Node 20.9+ 필요 (18은 지원 종료)
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: web-next/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
