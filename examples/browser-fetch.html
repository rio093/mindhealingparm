<!doctype html>
<!-- Minimal example: call the deployed /api/ritual-card from any page. -->
<meta charset="utf-8">
<title>ritual-card fetch example</title>
<button id="go">Generate card</button>
<pre id="out"></pre>
<script>
document.getElementById('go').onclick = async () => {
  const res = await fetch('/api/ritual-card', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ q1: 'meeting', q2: 'b', q3: 'a', locale: 'en' }),
  });
  document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
};
</script>
